name: Build and Push Multi-Arch Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    
    strategy:
      matrix:
        php_version: ['8.4', '8.5']
        frankenphp_version: ['1.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine if latest tag
        id: latest
        run: |
          if [ "${{ matrix.php_version }}" = "8.5" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "is_latest=true" >> $GITHUB_OUTPUT
          else
            echo "is_latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            kimtrien/phpx
            ghcr.io/kimtrien/phpx
          tags: |
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest }}
            type=raw,value=php${{ matrix.php_version }}
            type=raw,value=php${{ matrix.php_version }}-frankenphp${{ matrix.frankenphp_version }}
            type=semver,pattern={{version}},suffix=-php${{ matrix.php_version }}
            type=semver,pattern={{major}}.{{minor}},suffix=-php${{ matrix.php_version }}
            type=sha,prefix=php${{ matrix.php_version }}-
          labels: |
            org.opencontainers.image.title=PHPX
            org.opencontainers.image.description=Production-ready PHP base image powered by FrankenPHP with pre-installed extensions
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            FRANKENPHP_VERSION=${{ matrix.frankenphp_version }}
          cache-from: type=gha,scope=php${{ matrix.php_version }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php_version }}

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/kimtrien/phpx
          subject-digest: ${{ steps.meta.outputs.digest }}
          push-to-registry: true
