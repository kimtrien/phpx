version: '3.8'

services:
  app:
    image: kimtrien/phpx
    # Or use GHCR:
    # image: ghcr.io/kimtrien/phpx
    ports:
      - "8000:8000"
    volumes:
      - ./your-app:/app
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    command: php artisan octane:frankenphp --host=0.0.0.0 --port=8000
    networks:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app

  redis:
    image: redis:7-alpine
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
